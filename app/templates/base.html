<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WorkerSafety HUD{% endblock %}</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS styles -->
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/hud_thumbnails.css" />
    <link rel="stylesheet" href="/static/css/hud_drawer.css" />
    <link rel="stylesheet" href="/static/css/hud_sidesheet.css" />
    <link rel="stylesheet" href="/static/css/toast.css" />
    <link rel="stylesheet" href="/static/css/gpu_manager.css" />
    
    <!-- HTMX Core & SSE plugin -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
</head>
<body style="margin: 0; background: #0b0f19; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh;">
    {% block content %}{% endblock %}
</body>
</html>
