<div class="hud-btn-group" title="Navigasi Sumber Stream">
    <button class="hud-btn--shortcut-action" onclick="alert('Playback control mock')">◀</button>
    <button class="hud-btn--shortcut-action" onclick="alert('Playback control mock')">▶</button>
    <span class="hud-btn-group-label" style="display:inline-flex; align-items:center; gap:4px;">
        <kbd>PLAYBACK</kbd>
    </span>
</div>

<button id="btn-bottom-select" class="hud-btn hud-btn--shortcut hud-btn--active" title="Mode Select [S]">
    <kbd>S</kbd>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block; vertical-align:middle; margin-left:2px;"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
</button>

<button id="btn-bottom-toggle-zen" class="hud-btn hud-btn--shortcut" title="Toggle Zen Mode [Z]">
    <kbd>Z</kbd>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block; vertical-align:middle; margin-left:2px;"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
</button>

<button id="btn-bottom-fit-image" class="hud-btn hud-btn--shortcut" title="Fit Canvas Mode [Shift+W]">
    <kbd>⇧</kbd><kbd>W</kbd>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block; vertical-align:middle; margin-left:2px;"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
</button>

<button id="btn-bottom-help" class="hud-btn hud-btn--shortcut" title="Keyboard Shortcuts Help [?]">
    <kbd>?</kbd>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block; vertical-align:middle; margin-left:2px;"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
</button>
