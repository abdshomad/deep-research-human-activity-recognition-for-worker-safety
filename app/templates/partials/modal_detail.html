<div class="hud-modal-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px); z-index: 10000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease-out;">
    <div class="hud-modal-box" style="background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; width: 90%; max-width: 850px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); backdrop-filter: blur(16px); color: #f8fafc; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
        
        <!-- Header -->
        <div style="padding: 18px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.02);">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 18px;">🚨</span>
                <h3 style="margin: 0; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #fff;">
                    Detail Pelanggaran K3 - Pekerja #{{ v.worker_id }}
                </h3>
            </div>
            <button onclick="document.getElementById('modal-container').innerHTML = ''" style="background: none; border: none; color: rgba(255, 255, 255, 0.4); font-size: 20px; cursor: pointer; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.4)'">&times;</button>
        </div>
        
        <!-- Content Body -->
        <div style="display: flex; flex-wrap: wrap; padding: 24px; gap: 24px; max-height: 70vh; overflow-y: auto;">
            
            <!-- Left Side: Image Snapshot -->
            <div style="flex: 1.2; min-width: 320px; display: flex; flex-direction: column; gap: 12px;">
                <div style="position: relative; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); background: #000; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;">
                    <img src="{{ v.image_path }}" alt="Bukti Pelanggaran" style="width: 100%; height: 100%; object-fit: contain;" />
                    <div style="position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 20px; font-size: 9px; font-weight: bold; background: rgba(239, 68, 68, 0.85); color: white; border: 1px solid rgba(255,255,255,0.2);">
                        BUKTI SNAPSHOT
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: rgba(255, 255, 255, 0.5); background: rgba(255,255,255,0.02); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04);">
                    <span>🕒 Waktu: <strong>{{ v.timestamp }}</strong></span>
                    <span>🆔 ID Log: <strong>#{{ v.id }}</strong></span>
                </div>
            </div>
            
            <!-- Right Side: Details & Action Form -->
            <div style="flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 18px;">
                <!-- Status & Risk -->
                <div style="display: flex; gap: 12px; align-items: center;">
                    <span style="font-size: 11px; color: rgba(255,255,255,0.5);">Tingkat Risiko:</span>
                    <span class="hud-badge {% if v.risk_level == 'BAHAYA' %}hud-badge--bahaya{% else %}hud-badge--waspada{% endif %}" style="padding: 4px 12px; font-size: 10.5px; font-weight: bold; border-radius: 20px;">
                        {{ v.risk_level }}
                    </span>
                    <span style="font-size: 11px; color: rgba(255,255,255,0.5); margin-left: auto;">Status DB:</span>
                    <span style="font-size: 10px; font-weight: 600; text-transform: uppercase; color: #38bdf8; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); padding: 2px 8px; border-radius: 4px;">
                        {{ v.status }}
                    </span>
                </div>

                <!-- Reasons -->
                <div style="background: rgba(239, 68, 68, 0.04); border: 1px solid rgba(239, 68, 68, 0.15); border-radius: 8px; padding: 12px;">
                    <strong style="color: #f87171; font-size: 11px; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px;">Pemicu Bahaya Terdeteksi:</strong>
                    <ul style="margin: 0; padding-left: 16px; font-size: 11px; color: #fca5a5; line-height: 1.5;">
                        {% for r in reasons_list %}
                        <li>{{ r }}</li>
                        {% endfor %}
                    </ul>
                </div>

                <!-- Follow up Action Form -->
                <form hx-post="/api/violations/{{ v.id }}/action" hx-swap="none" style="display: flex; flex-direction: column; gap: 14px;">
                    
                    <!-- Form Field: Status -->
                    <div>
                        <label style="font-size: 10.5px; font-weight: bold; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); display: block; margin-bottom: 6px; letter-spacing: 0.5px;">
                            Verifikasi Status Pelanggaran
                        </label>
                        <select name="status" style="width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; padding: 8px 12px; font-size: 11.5px; color: #fff; outline: none; cursor: pointer;">
                            <option value="draft" {% if v.status == 'draft' %}selected{% endif %} style="background: #0f172a;">📝 Draft (Belum diverifikasi)</option>
                            <option value="confirmed" {% if v.status == 'confirmed' %}selected{% endif %} style="background: #0f172a;">✅ Konfirmasi Pelanggaran Resmi</option>
                            <option value="ignored" {% if v.status == 'ignored' %}selected{% endif %} style="background: #0f172a;">🔕 Abaikan (False Alarm / Salah Deteksi)</option>
                        </select>
                    </div>

                    <!-- Form Field: Action Taken -->
                    <div>
                        <label style="font-size: 10.5px; font-weight: bold; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); display: block; margin-bottom: 6px; letter-spacing: 0.5px;">
                            Tindakan Follow-Up K3
                        </label>
                        <select name="action_taken" style="width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; padding: 8px 12px; font-size: 11.5px; color: #fff; outline: none; cursor: pointer;">
                            <option value="none" {% if v.action_taken == 'none' %}selected{% endif %} style="background: #0f172a;">⚪ Tidak ada tindakan lanjutan</option>
                            <option value="warning_sent" {% if v.action_taken == 'warning_sent' %}selected{% endif %} style="background: #0f172a;">⚠️ Kirim Notifikasi Alert ke Supervisor</option>
                            <option value="buzzer_triggered" {% if v.action_taken == 'buzzer_triggered' %}selected{% endif %} style="background: #0f172a;">📢 Picu Peringatan Suara / Speaker Area</option>
                        </select>
                    </div>

                    <!-- Form Field: Notes -->
                    <div>
                        <label style="font-size: 10.5px; font-weight: bold; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); display: block; margin-bottom: 6px; letter-spacing: 0.5px;">
                            Catatan Tindakan
                        </label>
                        <textarea name="notes" placeholder="Tulis catatan penanganan pelanggaran di sini..." rows="3" style="width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; padding: 8px 12px; font-size: 11.5px; color: #fff; outline: none; resize: none; font-family: inherit; line-height: 1.4;">{{ v.notes }}</textarea>
                    </div>

                    <!-- Actions -->
                    <div style="display: flex; gap: 10px; margin-top: 6px; justify-content: flex-end;">
                        <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); color: rgba(255,255,255,0.7); font-size: 11px; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
                            Batal
                        </button>
                        <button type="submit" style="background: #2563eb; border: none; color: #fff; font-size: 11px; padding: 8px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
                            Simpan Tindakan
                        </button>
                    </div>
                </form>
            </div>
            
        </div>
    </div>
</div>

<style>
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
@keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
</style>
